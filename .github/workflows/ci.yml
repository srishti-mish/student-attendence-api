name: CI Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Code checkout karein
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Python setup karein
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Dependencies install karein
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Automated Testing run karein (pytest)
      - name: Run tests with pytest
        run: |
          pytest
          # 4. Automated Testing run karein (pytest)
- name: Run tests with pytest
  run: |
    pytest
# 4. Automated Testing run karein (pytest)
- name: Run tests with pytest
  run: |
    pytest test_app.py